services:
  postgres:
    image: postgres:16-alpine
    container_name: ea-postgres
    environment:
      POSTGRES_DB: eaagent
      POSTGRES_USER: eaagent
      POSTGRES_PASSWORD: eaagent_dev
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eaagent -d eaagent"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - ea-pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ea-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - ea-redisdata:/data

  mock-gw:
    build: ./mock-gw
    container_name: ea-mock-gw
    environment:
      CALLBACK_URL: http://ea-app:8081/api/channels/sms/callback
      EMAIL_CALLBACK_URL: http://ea-app:8081/api/channels/email/callback
      CALLBACK_SECRET: sms-callback-secret-1
      SMS_API_KEY: test-api-key
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  ea-app:
    build:
      context: .
      dockerfile: ea-app/Dockerfile
    container_name: ea-app
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/eaagent?stringtype=unspecified
      DB_USER: eaagent
      DB_PASS: eaagent_dev
      REDIS_URL: redis://redis:6379
      EA_SEED: "true"
      MODEL_NAME: ${EA_LLM_MODEL_ID:-}
      MODEL_API_KEY: ${EA_LLM_API_KEY:-}
      MODEL_BASE_URL: ${EA_LLM_BASE_URL:-}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 6<>/dev/tcp/127.0.0.1/8081'"]
      interval: 10s
      timeout: 5s
      retries: 12

  ea-web:
    build: ./ea-web
    container_name: ea-web
    ports:
      - "8082:80"
    depends_on:
      ea-app:
        condition: service_healthy

volumes:
  ea-pgdata:
  ea-redisdata: