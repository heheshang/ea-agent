server:
  port: 8081

spring:
  application:
    name: ea-agent
  # 本地运行从仓库根目录启动时自动加载 .env（EA_LLM_* 等）；容器内无 .env，optional 静默跳过
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/eaagent?stringtype=unspecified}
    username: ${DB_USER:eaagent}
    password: ${DB_PASS:eaagent_dev}
    hikari:
      maximum-pool-size: 10
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6380}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
  threads:
    virtual:
      enabled: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

ea:
  tenant:
    header: X-Tenant-Id
    context-key: ea:tenant:ctx
  queue:
    events: ea:events
    touch: ea:touch
    dlq: ea:events:dlq
    consumer-group: ea:consumer
  crypto:
    master-key: ${MASTER_KEY:dev-master-key-do-not-use-in-prod-32b}
  agent:
    session-ttl: 86400
    approval-timeout-ms: 600000
    max-tool-rounds: 20
    summary-threshold-rounds: 20
  security:
    jwt-secret: ${JWT_SECRET:ea-dev-jwt-secret-change-me-please-32bytes!}
    jwt-access-ttl-ms: 7200000
    mfa:
      enabled-endpoints: [channel.write, agent.approve, tenant.manage]
      code-ttl-ms: 60000
      token-ttl-ms: 300000
      max-attempts: 5
      delivery-channel: console
  channels:
    console-enabled: ${EA_CHANNEL_CONSOLE:true}
  agentscope:
    # 优先级：容器/compose 注入的 MODEL_* → 本地 .env 的 EA_LLM_* → 空（MockAgentEngine 降级）。
    # 注意：Spring 占位符分隔符是单个冒号（${A:default}），不是 bash 的 :-（会导致值带前导 -）
    model: ${MODEL_NAME:${EA_LLM_MODEL_ID:}}
    api-key: ${MODEL_API_KEY:${EA_LLM_API_KEY:}}
    base-url: ${MODEL_BASE_URL:${EA_LLM_BASE_URL:}}
    workspace-dir: ${AGENT_WORKSPACE:.agentscope/workspace}
  seed:
    enabled: ${EA_SEED:true}

logging:
  level:
    com.eaagent: INFO
    org.springframework.data.redis: WARN